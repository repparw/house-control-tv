name: webOS standalone
on:
  push:
    branches: ['webos/**']
  pull_request:
    paths: ['web/**', 'docs/webos.md', '.github/workflows/webos.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node --test webos/*.test.mjs
      - run: npm run build:webos
      - run: npx --yes --package=@webos-tools/cli@3.2.6 ares-package dist --outdir ../.local/webos
      - uses: actions/upload-artifact@v4
        with:
          name: house-control-webos-ipk
          path: .local/webos/*.ipk
          if-no-files-found: error
          retention-days: 7
