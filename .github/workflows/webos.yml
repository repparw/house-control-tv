name: webOS standalone
on:
  push:
    branches: ['webos/**']
    tags: ['webos-v*']
  pull_request:
    paths: ['web/**', 'docs/webos.md', '.github/workflows/webos.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: node --test webos/*.test.mjs
      - run: pnpm run build:webos
      - run: npx --yes --package=@webos-tools/cli@3.2.6 ares-package dist --outdir ../.local/webos
      - uses: actions/upload-artifact@v4
        with:
          name: house-control-webos-ipk
          path: .local/webos/*.ipk
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/webos-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: house-control-webos-ipk
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version web/webos/appinfo.json)
          test "$GITHUB_REF_NAME" = "webos-v$version"
          gh release create "$GITHUB_REF_NAME" "package/dev.housecontrol.webos_${version}_all.ipk" \
            --verify-tag --title "House Control for webOS $version" --generate-notes
